# Release: push a tag  apt/v<rclrs-version>-<rev>  (e.g. apt/v0.8.0-1).
# Builds + tests all distros/arches, publishes a GitHub Release and the signed apt repo on Pages,
# then installs from the live repo to verify.
name: apt release

on:
  push:
    tags: ["apt/v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.v.outputs.rev }}
      distros: ${{ steps.v.outputs.distros }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#apt/v}"           # 0.8.0-1
          ver="${tag%-*}"; rev="${tag##*-}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::tag must be apt/v<X.Y.Z>-<rev>"; exit 1; }
          cargo_ver="$(sed -n 's/^version = "\(.*\)"/\1/p' rclrs/Cargo.toml | head -1)"
          [ "$ver" = "$cargo_ver" ] || { echo "::error::tag version $ver != rclrs/Cargo.toml $cargo_ver"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          source packaging/versions.env
          echo "distros=$(printf '%s\n' $DISTROS | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    uses: ./.github/workflows/apt-build.yml
    with:
      rev: ${{ needs.validate.outputs.rev }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "::error::APT_SIGNING_KEY secret missing"; exit 1; }
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          echo "APT_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build apt repo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq reprepro
          packaging/apt-repo.sh artifacts site
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist && find artifacts -name '*.deb' -exec cp -n {} dist/ \;
          (cd dist && sha256sum *.deb > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes "Unofficial ROS 2 Rust packages. Install: see packaging/README.md. Apt repo: https://signalbotics.github.io/ros2_rust"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  verify:
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJson(needs.validate.outputs.distros) }}
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    name: verify ${{ matrix.distro }} / ${{ matrix.platform.arch }} from live repo
    steps:
      - uses: actions/checkout@v4
      - name: Install from published apt repo and run node
        run: |
          for i in 1 2 3 4 5; do
            docker run --rm -e ROS_DISTRO=${{ matrix.distro }} -e SOURCE=repo -v "$PWD:/src/ros2_rust:ro" \
              ros:${{ matrix.distro }}-ros-base /src/ros2_rust/packaging/test/test-debs.sh && exit 0
            echo "attempt $i failed (Pages may still be propagating), retrying in 60s"; sleep 60
          done
          exit 1
